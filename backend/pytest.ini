[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Tests must share the session loop: AsyncMongoClient binds to the loop it was
# created on, so a per-test loop cannot reuse the connection opened by lifespan.
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
